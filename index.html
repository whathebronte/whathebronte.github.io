<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Danil Palma</title>
  <meta name="description" content="Marketer and content creator based in Singapore.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://danilpalma.com/">
  <meta property="og:title" content="Danil Palma">
  <meta property="og:description" content="Marketer and content creator based in Singapore.">
  <meta property="og:image" content="https://danilpalma.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Danil Palma">
  <meta name="twitter:description" content="Marketer and content creator based in Singapore.">
  <meta name="twitter:image" content="https://danilpalma.com/og-image.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23121211'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-style='italic' font-size='30' fill='%23fff' text-anchor='middle'%3EDP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&display=swap">
  <style>
  /* Layout: one white screen. Centred serif headline, two buttons, interactive dot field behind */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #121211;
    --muted: #8c8c87;
    --on-ink: #ffffff;
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --sans: 'Geist', 'Helvetica Neue', Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 999px; }

  .dotfield { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  .page {
    position: relative; z-index: 1; min-height: 100%;
    display: flex; flex-direction: column;
    padding-inline: clamp(20px, 5vw, 48px);
    padding-block: 26px;
  }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 6vh; }

  h1 {
    font-family: var(--serif); font-weight: 400; margin: 0;
    font-size: min(clamp(46px, 7.6vw, 108px), calc((100vw - 40px) / 6.4)); line-height: 1.02; letter-spacing: -0.025em;
    max-width: 12.5em; text-wrap: balance;
  }
  h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
  h1 .w > span { display: inline-block; animation: rise 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 55ms + 150ms); }
  h1 .name { color: var(--muted); }
  h1 .nb { white-space: nowrap; }
  @keyframes rise { from { transform: translateY(105%); } to { transform: translateY(0); } }

  .lede { color: var(--muted); max-width: 40ch; margin: 28px auto 0; animation: fade 1s ease both .9s; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 36px; animation: fade 1s ease both 1.05s; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .socials { display: flex; gap: 12px; }
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 26px; border-radius: 999px; font: 500 14px/1 var(--sans);
    border: 1px solid var(--ink); background: var(--bg); color: var(--ink); cursor: pointer;
    overflow: hidden; isolation: isolate;
    transition: color .35s, transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .btn::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ink);
    border-radius: inherit; transform: translateY(101%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .btn:hover::before { transform: none; }
  .btn:hover { color: var(--on-ink); }
  .btn.solid { background: var(--ink); color: var(--on-ink); box-shadow: 0 14px 30px -14px rgba(0,0,0,.55); }
  .btn.solid::before { background: #3a3a38; }
  .btn .label { display: inline-flex; gap: 10px; align-items: center; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .btn svg { width: 11px; height: 11px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .btn:hover svg { transform: translate(2px, -2px); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
    transform: translate(-50%, calc(100% + 40px)); opacity: 0;
    background: var(--ink); color: var(--on-ink); padding: 12px 18px; border-radius: 999px; font-size: 13px;
    transition: transform .55s cubic-bezier(.2,.9,.2,1.2), opacity .3s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  .cursor {
    position: fixed; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; z-index: 70;
    background: #fff; mix-blend-mode: difference; pointer-events: none; opacity: 0;
    transition: width .3s, height .3s, margin .3s, opacity .3s;
  }
  @media (pointer: fine) {
    .cursor { opacity: 1; }
    .cursor.big { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
  }

  @media (max-width: 600px) {
    .page { padding-block: 20px; }
    .actions { flex-direction: column; align-items: stretch; width: min(340px, 100%); }
    .socials .btn { flex: 1; padding-inline: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas class="dotfield" id="dotfield" aria-hidden="true"></canvas>
<div class="cursor" id="cursor"></div>

<div class="page">
  <main>
    <h1 id="headline"><span class="nb">I'm <em class="name">Danil Palma</em>,</span> a <em>marketer</em> and <em>content creator</em> based in Singapore.</h1>
    <p class="lede">I tell stories that connect brands with people.</p>
    <div class="actions">
      <button class="btn solid magnetic" data-copy type="button"><span class="label">Email me <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10 10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></button>
      <div class="socials">
        <a class="btn magnetic" href="https://www.linkedin.com/in/danilpalma" target="_blank" rel="noopener"><span class="label">LinkedIn <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10 10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></a>
        <a class="btn magnetic" href="https://www.instagram.com/whathebronte" target="_blank" rel="noopener"><span class="label">Instagram <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10 10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></a>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">&#10003; Email copied: whathebronte@gmail.com</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EMAIL = 'whathebronte@gmail.com';

  // headline words rise in one by one
  const h1 = document.getElementById('headline');
  let i = 0;
  const wrapWords = (node) => [...node.childNodes].forEach((n) => {
    if (n.nodeType === 3) {
      const frag = document.createDocumentFragment();
      n.textContent.split(/(\s+)/).forEach((part) => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.append(part); return; }
        const w = document.createElement('span'); w.className = 'w';
        const s = document.createElement('span'); s.textContent = part; s.style.setProperty('--i', i++);
        w.append(s); frag.append(w);
      });
      n.replaceWith(frag);
    } else if (n.nodeType === 1) wrapWords(n);
  });
  wrapWords(h1);

  // email button: copy the address, then open the mail app
  const toast = document.getElementById('toast');
  let tt;
  document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
    const show = () => { toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 2600); };
    try { navigator.clipboard.writeText(EMAIL).then(show, show); } catch (e) { show(); }
    location.href = 'mailto:' + EMAIL;
  }));

  // dot field that scatters away from the pointer and springs back
  const cv = document.getElementById('dotfield');
  const ctx = cv.getContext('2d');
  const GAP = 26, R = 150, BASE = 1.1;
  let w = 0, h = 0, cols = 0, rows = 0, dots = [], mx = -9999, my = -9999;
  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / GAP) + 2; rows = Math.ceil(h / GAP) + 2;
    dots = Array.from({ length: cols * rows }, () => ({ dx: 0, dy: 0, vx: 0, vy: 0, s: 0 }));
  };
  resize(); addEventListener('resize', resize);
  addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });
  addEventListener('pointerdown', (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });
  addEventListener('touchmove', (e) => { const t = e.touches[0]; if (t) { mx = t.clientX; my = t.clientY; } }, { passive: true });
  addEventListener('touchend', () => { mx = my = -9999; });
  document.addEventListener('mouseleave', () => { mx = my = -9999; });
  const frame = () => {
    ctx.clearRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const d = dots[r * cols + c];
      const x = c * GAP - GAP / 2 + d.dx, y = r * GAP - GAP / 2 + d.dy;
      const ex = x - mx, ey = y - my, dist = Math.hypot(ex, ey);
      let target = 0;
      if (!reduce && dist < R) {
        const f = 1 - dist / R; target = f;
        d.vx += (ex / (dist || 1)) * f * 2.2; d.vy += (ey / (dist || 1)) * f * 2.2;
      }
      d.vx = (d.vx - d.dx * 0.06) * 0.82; d.vy = (d.vy - d.dy * 0.06) * 0.82;
      d.dx += d.vx; d.dy += d.vy;
      d.s += (target - d.s) * 0.15;
      ctx.fillStyle = `rgba(30,30,30,${0.16 + d.s * 0.6})`;
      ctx.beginPath(); ctx.arc(x, y, BASE + d.s * 2.2, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  // cursor dot and magnetic buttons (mouse only)
  if (matchMedia('(pointer: fine)').matches && !reduce) {
    const cur = document.getElementById('cursor');
    let cx = innerWidth / 2, cy = innerHeight / 2, tx = cx, ty = cy;
    addEventListener('pointermove', (e) => { tx = e.clientX; ty = e.clientY; });
    const follow = () => { cx += (tx - cx) * 0.2; cy += (ty - cy) * 0.2; cur.style.transform = `translate3d(${cx}px,${cy}px,0)`; requestAnimationFrame(follow); };
    follow();
    document.querySelectorAll('a, button').forEach((el) => {
      el.addEventListener('pointerenter', () => cur.classList.add('big'));
      el.addEventListener('pointerleave', () => cur.classList.remove('big'));
    });
    document.querySelectorAll('.magnetic').forEach((b) => {
      const label = b.querySelector('.label');
      b.addEventListener('pointermove', (e) => {
        const r = b.getBoundingClientRect();
        const mx2 = e.clientX - (r.left + r.width / 2), my2 = e.clientY - (r.top + r.height / 2);
        b.style.transform = `translate(${mx2 * 0.25}px, ${my2 * 0.35}px)`;
        label.style.transform = `translate(${mx2 * 0.12}px, ${my2 * 0.15}px)`;
      });
      b.addEventListener('pointerleave', () => { b.style.transform = ''; label.style.transform = ''; });
    });
  }
})();
</script>
</body>
</html>
