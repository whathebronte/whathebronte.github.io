<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danil Palma</title>
  <meta name="description" content="Danil Palma, marketer and content creator based in Singapore.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #e6e6e4;
      --card: #f7f7f5;
      --ink: #111111;
      --muted: #8a8a86;
      --line: #d9d9d5;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
    }

    .card {
      position: relative;
      min-height: calc(100vh - 32px);
      min-height: calc(100dvh - 32px);
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      padding: 28px 32px;
      overflow: hidden;
    }

    /* soft light wash, like the references */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 80% at 20% 0%, #ffffff 0%, rgba(255, 255, 255, 0) 60%);
      pointer-events: none;
    }

    header, footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .logo {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3bb36b;
      box-shadow: 0 0 0 4px rgba(59, 179, 107, 0.15);
    }

    main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 0;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: clamp(44px, 7.4vw, 104px);
      line-height: 1.02;
      letter-spacing: -0.02em;
      max-width: 13em;
    }

    h1 em {
      color: var(--muted);
    }

    .intro {
      margin-top: 28px;
      max-width: 34ch;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }

    .actions {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.5);
    }

    .btn-secondary {
      color: var(--ink);
      border: 1px solid var(--ink);
    }

    .btn-secondary:hover {
      background: var(--ink);
      color: #fff;
    }

    .arrow {
      font-size: 15px;
      line-height: 1;
    }

    footer {
      color: var(--muted);
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    /* gentle entrance */
    .reveal {
      opacity: 0;
      animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.3s; }
    .d3 { animation-delay: 0.5s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; }
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .card {
        min-height: calc(100vh - 20px);
        min-height: calc(100dvh - 20px);
        padding: 20px;
        border-radius: 16px;
      }
      .status span { display: none; }
      .actions { flex-direction: column; width: 100%; max-width: 300px; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="logo">Danil Palma</div>
      <div class="status"><span>Open to collaborations</span></div>
    </header>

    <main>
      <h1 class="reveal d1">I'm <em>Danil</em>, a marketer and <em>content creator</em> based in Singapore.</h1>
      <p class="intro reveal d2">Telling stories that connect brands with people. Always up for a good conversation.</p>
      <div class="actions reveal d3">
        <a class="btn btn-primary" href="mailto:whathebronte@gmail.com">Email me <span class="arrow">&#8599;</span></a>
        <a class="btn btn-secondary" href="https://www.linkedin.com/in/danilpalma" target="_blank" rel="noopener">LinkedIn <span class="arrow">&#8599;</span></a>
      </div>
    </main>

    <footer>
      <span>@whathebronte</span>
      <span>Singapore &middot; &copy;2026</span>
    </footer>
  </div>
</body>
</html>
